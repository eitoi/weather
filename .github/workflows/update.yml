# Publishes the app to GitHub Pages. Every hour it refreshes the Outlook data. The Weather tab's HRRR data and the
# Avalanche tab's data are only downloaded when asked for (each tab's ↻ button, or "Run workflow" with
# "Fetch HRRR" or "Fetch avalanche data" ticked).
# Setup: Settings -> Pages -> Source: "GitHub Actions". Optional secret ANTHROPIC_API_KEY for the written outlook.
name: Update forecast

on:
  schedule:
    - cron: "55 * * * *"      # outlook; reuses the last HRRR and avalanche builds
  workflow_dispatch:
    inputs:
      hrrr:
        description: Fetch HRRR for the Weather tab
        type: boolean
        default: true
      avalanche:
        description: Fetch avalanche data (HRRR history, center ratings, SNOTEL)
        type: boolean
        default: false
  push:                       # deploy app changes as soon as they're pushed
    branches: [main]
    paths-ignore: ["README.md", "tools/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: cache
          key: hrrr-cache-${{ github.run_id }}
          restore-keys: hrrr-cache-
      - name: Build forecast data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FETCH_HRRR: ${{ github.event_name == 'workflow_dispatch' && inputs.hrrr }}
          FETCH_AVY: ${{ github.event_name == 'workflow_dispatch' && inputs.avalanche }}
        run: >-
          python -m ingest.run --workers 32 $([ "$FETCH_HRRR" = true ] || echo --no-hrrr)
          $([ "$FETCH_AVY" = true ] || echo --no-avalanche)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
